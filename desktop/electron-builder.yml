# Spec 8 §2.10：打包加固冻结项。TG-5 逐项守护，改动 = 修订 spec。
appId: local.ava.desktop
productName: ava
directories:
  output: dist
# 只打构建产物与构建溯源：out/ 下还有 e2e 的结果目录（截图含夹具路径），不许进包
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - out/build-info.json
  - package.json
asar: true
# 未设 publish 时 electron-builder 会按 npm release / CI tag / CI 环境隐式发布（红线 6）
publish: null
mac:
  target: dir
  # null = 跳过签名、不查 keychain；只有 fuses 步骤对主二进制 ad-hoc 重签（假设 1）
  identity: null
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # true：renderer 经 file:// 从 asar 载入，关掉这一位打包版窗口空白（S23 实测 ERR_FILE_NOT_FOUND，经用户同意）
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
