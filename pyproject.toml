[project]
name = "anime-video-agent"
version = "0.1.0"
description = "一条把选题变成动漫二创成片的 agent 流水线：字幕语义索引 → 排片 → 本地 TTS → 渲染 → 自动质检"
readme = "README.md"
# 2026-07-30 实测：3.12 / 3.13 / 3.14 三个版本都跑通（各 165 条测试 + mlx 真算 + numba 真 JIT）。
# 3.15 还在 beta，没验，所以卡在 <3.15。
#
# 原先这里写的是 `<3.13`，理由是「部分 ML 包尚无对应 wheel」——**那句话当初没验，而且是错的**。
# 全部直接依赖都声明 >=3.10，没有一个有上界；真正的约束在下面 numpy 那一行。
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }

# 这条流水线依赖若干库的**具体行为**而不只是 API：
#   - mlx-audio 0.4.6 的 IndexTTS 解码有两处 bug，我们绕开它自己解码（见 ADR-0002），
#     上游修好之后这段要重测再删
#   - libass 的中文折行行为决定了 render.wrap 必须自己算宽度
# 所以升级任何一项之后都要重跑一遍端到端，不要只看能不能 import。
dependencies = [
    # **上界不能删。** 依赖链是 mlx-whisper → numba → llvmlite，而 numba 0.66 要求
    # numpy<2.5。numpy 2.5 一出来（requires-python >=3.12，所以 3.12 也拿得到），
    # 解析器就把 numba 0.66 排除，一路回退到 numba 0.53.1，它的 llvmlite 0.36
    # 只支持 <3.10，于是转去源码构建并失败。
    #
    # 2026-07-30 实测：不写这条上界，**在 3.12 上全新 clone 也装不上**。
    # 这个坑的坏处在于它只咬新环境——已有的 venv 是 numpy 2.5 发布前建的，一切正常，
    # 所以「我这儿能跑」完全不构成证据。numba 支持 numpy 2.5 之后再放开。
    "numpy>=2.0,<2.5",
    "pysubs2>=1.8",          # ASS/SRT 解析
    "sentence-transformers>=5.0",  # bge-base-zh-v1.5 向量检索
    "pillow>=11.0",          # 封面候选的清晰度/去重计算
    "pypinyin>=0.55.0",
    # 视觉索引的两个模型都是 ONNX：动漫人脸检测（YOLOv8）与 CCIP 角色嵌入。
    # **只用 CPUExecutionProvider**——2026-08-03 实测 CoreML 那条路在这些图上跑不通
    # （onnxruntime 把节点切成几百个 CoreML 分区，其中一个运行时直接报错）。
    "onnxruntime>=1.28.0",
]

[project.optional-dependencies]
# **Apple Silicon 专用。** TTS 与 ASR 建在 mlx 上，Intel Mac / Linux / Windows 装不上。
# 不装这一组的话，第 05 步配音和 ASR 兜底不可用，其余步骤（索引、排片、渲染、质检、
# 封面）都能正常跑——它们只依赖 ffmpeg 和上面那几个包。
apple = [
    "mlx>=0.32",
    "mlx-audio>=0.4.6",
    "mlx-whisper>=0.4.3",
    "mlx-lm>=0.31",
]
# 测试只覆盖纯函数，**不需要片源、模型、外置盘**——clone 下来装完就能跑。
# 涉及媒体的部分靠 pipeline 自己的守卫（截取守卫、质检门禁）在真跑时兜。
dev = ["pytest>=8"]

[project.scripts]
# 每个阶段都能独立跑，产物落盘，中断可从中间接上（CLAUDE.md「每阶段产物落盘」）
ava-ingest = "pipeline.ingest:main"
ava-index = "pipeline.subindex:main"
ava-shots = "pipeline.shots:main"
ava-faces = "pipeline.faces:main"
ava-vindex = "pipeline.vindex:main"
ava-vprobe = "pipeline.vprobe:main"
ava-check-script = "pipeline.check_script:main"
ava-clips = "pipeline.clips:main"
ava-review = "pipeline.review:main"
ava-tts = "pipeline.tts:main"
ava-render = "pipeline.render:main"
ava-qc = "pipeline.qc:main"
ava-cover = "pipeline.cover:main"
ava-bgm = "pipeline.bgm:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 没有它，仓库根下裸跑 `pytest` 会 8 个 collection error（`No module named 'pipeline'`），
# 因为 pytest 的入口脚本不像 `python -m pytest` 那样把当前目录塞进 sys.path。
# 「先 pip install -e . 再测」也能绕过去，但那让「clone 下来就能跑测试」这句话变成假的。
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
