<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AVA · 新建一期选型</title>
  <link rel="stylesheet" href="../../../../desktop/src/renderer/tokens.css">
  <link rel="stylesheet" href="../../../../desktop/src/renderer/ui.css">
  <link rel="stylesheet" href="../../../../desktop/src/renderer/style.css">
  <link rel="stylesheet" href="./mock.css">
</head>
<body data-scheme="now">
<div class="mock-label" id="scheme-label">现状</div>
<div class="app">
<header class="topbar">
  <div class="topbar-row">
    <span class="wordmark">AVA</span>
    <span class="ui-badge ui-badge--warn">DEV BUILD</span>
    <span class="repo">anime-video-agent-ava</span>
    <span class="spacer"></span>
    <button class="ui-btn ui-btn--ghost ui-btn--sm">侧栏</button>
    <button class="ui-btn ui-btn--ghost ui-btn--sm">预览</button>
  </div>
</header>
<div class="main">
<nav class="left">
  <div class="side-head">
    <button class="ui-btn ui-btn--sm mock-new" data-only="now">＋ 新建一期</button>
    <button class="ui-row proj-new" data-only="A">＋ 新建一期</button>
    <div class="side-head-row">
      <label class="ui-search" style="flex:1"><svg class="ui-icon ui-icon--sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><input class="ui-input" placeholder="搜索期名"></label>
      <button class="ui-btn ui-btn--ghost ui-btn--sm side-plus" data-only="B" aria-label="新建一期">＋</button>
    </div>
    <div class="new-episode-form" data-only="now">
      <label class="ui-field">期名<input class="ui-input" placeholder="例如 2026-10-01-春物-…" value=""></label>
      <button class="ui-btn">建期</button>
    </div>
    <div class="new-episode-form" data-only="A">
      <label class="ui-field">期名<input class="ui-input" placeholder="例如 2026-10-01-春物-…" value=""></label>
      <button class="ui-btn ui-btn--sm">建期</button>
    </div>
    <div class="ui-popover new-pop" data-only="B">
      <label class="ui-field">期名<input class="ui-input" placeholder="例如 2026-10-01-春物-…"></label>
      <button class="ui-btn ui-btn--sm">建期</button>
    </div>
    <div class="side-head-row"><div class="ui-seg"><button aria-pressed="true">按时间</button><button>按工序</button></div><span class="ui-count">2</span></div>
  </div>
  <div class="ui-section">选题</div>
  <button class="ui-row ep" aria-current="true">
    <span class="ep-line"><span class="ep-name">2026-10-01-测试番-人物志-一</span><span class="ep-time">刚刚</span></span>
    <span class="ep-step"><span class="ui-badge">停机</span><span class="ep-step-text">02.5 人审改稿</span></span>
  </button>
  <button class="ui-row ep">
    <span class="ep-line"><span class="ep-name">2026-10-02-测试番-人物志-二</span><span class="ep-time">刚刚</span></span>
    <span class="ep-step"><span class="ep-step-text">03.5 配音顺听 / 04 排片</span></span>
  </button>
</nav>
<div class="splitter"></div>
<section class="center conv-shell">
  <div class="status">
    <div class="status-step">02.5 人审改稿 <span class="ui-badge">停机</span><span class="spacer"></span><button class="ui-btn ui-btn--ghost ui-btn--sm">详情</button></div>
  </div>
  <div class="session-head">
    <button class="ui-btn ui-btn--ghost ui-btn--sm ui-btn--icon">−</button>
    <span class="ui-badge">上下文约 4,443 字</span>
    <span class="spacer"></span>
    <button class="ui-btn ui-btn--ghost ui-btn--sm">素材模式</button>
  </div>
  <div class="conv conv-stream">
    <div class="ui-card decision">
      <div class="ui-card-head"><span class="ui-card-title">02.5 人审改稿 <span class="ui-badge">停机</span></span></div>
      <div class="ui-card-actions"><button class="ui-btn">批准</button><button class="ui-btn">打回…</button></div>
    </div>
  </div>
  <div class="composer">
    <textarea rows="2" placeholder="告诉 ava 要做什么"></textarea>
    <div class="composer-row">
      <span class="composer-target">2026-10-01-测试番-人物志-一</span>
      <span class="spacer"></span>
      <button class="ui-btn ui-btn--primary ui-btn--sm">发送</button>
    </div>
  </div>
</section>
<div class="splitter"></div>
<section class="preview">
  <div class="preview-switch">
    <button class="ui-btn ui-btn--ghost ui-btn--sm preview-switch-btn"><span class="preview-switch-label">02-script.md</span></button>
  </div>
  <div class="muted" style="padding: var(--space-4);">预览</div>
</section>
</div>
</div>
</body>
</html>
